# Overlay for iDvel/rime-ice. Colors come from the current Squirrel setup.
patch:
  "style/color_scheme": pink_light
  "style/color_scheme_dark": pink_dark
  "style/candidate_list_layout": linear
  "style/text_orientation": horizontal
  "style/inline_preedit": true
  "style/inline_candidate": false
  "style/corner_radius": 5
  "style/border_height": 0
  "style/border_width": 0
  "style/line_spacing": 5
  "style/font_face": PingFangSC
  "style/font_point": 18
  "app_options/dev.zed.Zed/ascii_mode": true
  "app_options/dev.zed.Zed/vim_mode": true
  "app_options/com.mitchellh.ghostty/ascii_mode": true
  "app_options/com.mitchellh.ghostty/vim_mode": true
  "app_options/com.apple.Terminal/ascii_mode": true
  "app_options/com.apple.Terminal/vim_mode": true
  "app_options/com.termius-dmg.mac/ascii_mode": true
  "app_options/com.termius-dmg.mac/vim_mode": true
  "app_options/com.raycast.macos/ascii_mode": true
  "preset_color_schemes/pink_light":
    name: pink
    candidate_list_layout: linear
    inline_preedit: true
    candidate_format: "[label]\u2005[candidate]\u2005[comment]"
    corner_radius: 5
    border_height: 0
    border_width: 0
    back_color: 0xffffff
    font_face: PingFangSC
    font_point: 18
    text_color: 0x4F25D4
    label_font_face: OperatorMonoNerdFontComplete-Italic
    label_font_point: 16
    hilited_text_color: 0x4F25D4
    hilited_back_color: 0xD6E7FF
    hilited_candidate_text_color: 0x4F25D4
    hilited_candidate_back_color: 0xD6E7FF
    hilited_candidate_label_color: 0x4F25D4
    candidate_text_color: 0x4F25D4
    label_color: 0x7F8194
    comment_text_color: 0xB5A700
  "preset_color_schemes/pink_dark":
    name: dark_pink
    candidate_list_layout: linear
    inline_preedit: true
    candidate_format: "[label]\u2005[candidate]\u2005[comment]"
    corner_radius: 5
    border_height: 0
    border_width: 0
    back_color: 0x000000
    font_face: PingFangSC
    font_point: 18
    text_color: 0x9000FF
    label_font_face: OperatorMonoNerdFontComplete-Italic
    label_font_point: 16
    hilited_text_color: 0x9000FF
    hilited_back_color: 0x000066
    hilited_candidate_text_color: 0x9000FF
    hilited_candidate_back_color: 0xC2C2FF
    hilited_candidate_label_color: 0xFFFFFF
    candidate_text_color: 0x9000FF
    label_color: 0xFFFFFF
    comment_text_color: 0xB5A700
